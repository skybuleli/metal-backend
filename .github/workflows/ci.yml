name: CI — Build & Test

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 环境验证（非阻塞，仅供参考）
  # ═══════════════════════════════════════════════════════════════
  verify:
    name: 环境验证
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装可用工具
        run: |
          brew install \
            spirv-tools \
            spirv-cross \
            glslang \
            cmake \
            catch2 \
            shellcheck \
            2>&1 || true

      - name: 记录不可用工具
        run: |
          echo "以下工具需要手动安装，不影响构建："
          echo "  - slangc (brew install slang 或从 GitHub Release 下载)"
          echo "  - metal-shaderconverter (需通过 Xcode 或 Apple Developer 下载)"
          echo "  - devkitpro (brew install devkitpro/devkitpro/devkit-arm)"
          echo "  - /opt/devkitpro (仅 Switch 开发需要)"
        continue-on-error: true

      - name: 运行工具链验证
        run: bash tools/tools-verify.sh || echo "部分工具不可用（非阻塞）"
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # C++ 构建 + Catch2 测试（核心）
  # ═══════════════════════════════════════════════════════════════
  build-bridge:
    name: C++ libmetal_bridge 构建 & 测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          brew install cmake catch2

      - name: 配置 CMake
        run: |
          cd src/libmetal_bridge
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译 libmetal_bridge
        run: |
          cd src/libmetal_bridge
          cmake --build build --config Release

      - name: 运行 Catch2 测试
        run: |
          cd src/libmetal_bridge/build
          ctest --output-on-failure -V

  # ═══════════════════════════════════════════════════════════════
  # C# 构建验证
  # ═══════════════════════════════════════════════════════════════
  build-metal-cs:
    name: C# Ryujinx.Graphics.Metal 构建
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建 Metal 后端项目
        run: |
          cd src/ryubing
          dotnet build src/Ryujinx.Graphics.Metal/Ryujinx.Graphics.Metal.csproj \
            -c Release \
            --no-restore:false

  # ═══════════════════════════════════════════════════════════════
  # 代码检查（非阻塞）
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Python 语法检查
        run: |
          python3 -m py_compile tools/gen_next_task.py
          python3 -m py_compile tools/verify_progress.py

      - name: 验证 PROGRESS.md 格式
        run: python3 tools/verify_progress.py

      - name: Shell 脚本检查
        run: |
          sudo apt-get install -y shellcheck
          shellcheck tools/*.sh || true
        continue-on-error: true
